; Local runtime scaffold for the recoverable native UTGame target.
; This inherits only the retained engine baseline; compatible compiled script
; packages and game assets are intentionally not fabricated here.
[Configuration]
BasedOn=..\Engine\Config\BaseEngine.ini

[URL]
Map=ExampleEntry.udk
LocalMap=ExampleEntry.udk
TransitionMap=ExampleEntry.udk
MapExt=udk
EXEName=UTGame.exe
DebugEXEName=DEBUG-UTGame.exe
GameName=UTGame
GameNameShort=UT

[Core.System]
+Paths=..\..\UTGame\Content
+LocalizationPaths=..\..\UTGame\Localization
+SeekFreePCPaths=..\..\UTGame\CookedPC
+Extensions=udk

[Engine.StartupPackages]
; The base configuration expects this package to provide the required Master
; sound class.  A compatible package is retained with the local game content.

[Engine.Engine]
; Clear scene color before game and PIE rendering. Without this, uncovered
; pixels in blank or partially built maps retain the renderer's red debug fill.
bEnableColorClear=True

[Engine.ScriptPackages]
-EngineNativePackages=SubstanceAir
-EditorPackages=SubstanceAirEd
-ScaleformEditorPackages=GFxUIEditor
+NativePackages=UTGame
+NonNativePackages=UDKStarter

; GFxUI remains in the inherited package list because WITH_GFx=0 still
; supplies the native type-registration and serialization stubs required by
; existing UDK content.  GFxUIEditor remains excluded because its native
; implementation is only registered when the unavailable Scaleform SDK is
; enabled.  Do not inherit other unsupported template-only packages.
[UnrealEd.EditorEngine]
EditPackagesInPath=..\..\Development\Src
EditPackagesOutPath=..\..\UTGame\Script
FRScriptOutputPath=..\..\UTGame\ScriptFinalRelease
InEditorGameURLOptions=?quickstart=1?numplay=1
-EditPackages=GFxUIEditor
-EditPackages=OnlineSubsystemGameSpy
-EditPackages=OnlineSubsystemLive
-EditPackages=OnlineSubsystemSteamworks
-EditPackages=OnlineSubsystemGameCenter
-EditPackages=SubstanceAir
-EditPackages=SubstanceAirEd
+EditPackages=UTGame
+EditPackages=UDKStarter

[DevOptions.Shaders]
; UE3ShaderCompileWorker is rebuilt for the selected native platform by the
; local source-build pipeline, so first-run shader jobs may compile in parallel.
bAllowMultiThreadedShaderCompile=True

[TaskPerfTracking]
bUseTaskPerfTracking=FALSE
